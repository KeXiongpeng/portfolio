services:
  # ── nginx 反向代理 + Let's Encrypt 自动 HTTPS ──
  nginx:
    image: nginxproxy/nginx-proxy:latest
    restart: unless-stopped
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
    networks:
      - app-net

  acme:
    image: nginxproxy/acme-companion:latest
    restart: unless-stopped
    volumes_from:
      - nginx
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=${ACME_EMAIL:-admin@kxpwty.cn}
    networks:
      - app-net

  # ── PostgreSQL ──
  postgres:
    image: docker.1ms.run/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-portfolio}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ── Redis ──
  redis:
    image: docker.1ms.run/library/redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - app-net

  # ── NestJS 后端 API ──
  server:
    image: crpi-7znqdwo2lmmjl5kg.cn-shenzhen.personal.cr.aliyuncs.com/my-project-portfolio/server:v1.0.1
    restart: unless-stopped
    expose:
      - '3001'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
    environment:
      - VIRTUAL_HOST=api.kxp.o9k.cn
      - LETSENCRYPT_HOST=api.kxp.o9k.cn
      - VIRTUAL_PORT=3001
      - FRONTEND_URL=https://kxp.o9k.cn
      - GITHUB_CALLBACK_URL=https://api.kxp.o9k.cn/api/auth/github/callback
    networks:
      - app-net

  # ── Next.js 前端（含管理员后台 /admin） ──
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: https://api.kxp.o9k.cn
        NEXT_PUBLIC_SITE_URL: https://kxp.o9k.cn
    image: crpi-7znqdwo2lmmjl5kg.cn-shenzhen.personal.cr.aliyuncs.com/my-project-portfolio/web:v5
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      - VIRTUAL_HOST=kxp.o9k.cn
      - LETSENCRYPT_HOST=kxp.o9k.cn
      - VIRTUAL_PORT=3000
    depends_on:
      - server
    networks:
      - app-net

volumes:
  pgdata:
  redisdata:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  acme:

networks:
  app-net:
    driver: bridge
