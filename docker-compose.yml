version: '3.8'

services:
  # ── nginx 反向代理 + Let's Encrypt 自动 HTTPS ──
  nginx:
    image: docker.1ms.run/nginxproxy/nginx-proxy:latest
    restart: unless-stopped
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
    networks:
      - app-net

  acme:
    image: docker.1ms.run/nginxproxy/acme-companion:latest
    restart: unless-stopped
    volumes_from:
      - nginx
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=${ACME_EMAIL:-admin@kxpwty.cn}

  # ── PostgreSQL ──
  postgres:
    image: docker.1ms.run/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-portfolio}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ── Redis ──
  redis:
    image: docker.1ms.run/library/redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - app-net

  # ── NestJS 后端 API ──
  server:
    image: crpi-7znqdwo2lmmjl5kg.cn-shenzhen.personal.cr.aliyuncs.com/my-project-portfolio/server:v1.0.1
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
    environment:
      # 支持 IP 访问（域名备案后改回域名）
      - VIRTUAL_HOST=api.kxpwty.cn,120.77.222.102
      - LETSENCRYPT_HOST=api.kxpwty.cn
      - VIRTUAL_PORT=3001
      # 设置正确的前端和回调 URL
      - FRONTEND_URL=http://120.77.222.102:3000
      - GITHUB_CALLBACK_URL=http://120.77.222.102:3001/api/auth/github/callback
    networks:
      - app-net

  # ── Next.js 前端（含管理员后台 /admin） ──
  web:
    image: my-web-fixed:v2
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # 前端访问后端的API地址
      - NEXT_PUBLIC_API_URL=http://120.77.222.102:3001
      # 注意：HOSTNAME由start.sh脚本在容器内设置，不在这里配置
    depends_on:
      - server
    networks:
      - app-net

volumes:
  pgdata:
  redisdata:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  nginx_acme:

networks:
  app-net:
    driver: bridge
